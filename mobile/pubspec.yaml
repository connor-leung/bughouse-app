name: bughouse
description: Bughouse chess — real-time 4-player team chess
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Immutable models + freezed
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Chess logic
  dartchess: ^0.12.0

  # WebSocket (plain — matches Go server)
  web_socket_channel: ^3.0.2

  # Local persistence
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1

  # HTTP
  http: ^1.3.2

  # UI utilities
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  freezed: ^3.0.6
  riverpod_generator: ^2.6.5
  json_serializable: ^6.9.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/sounds/
